# Compila el instalador de BSOBPDF para Windows (BSOBPDF-Setup-x.y.z.exe).
#
# - En cada cambio del código en main: compila, prueba y deja el instalador como artefacto.
# - Al publicar una versión en «Releases»: además lo adjunta a esa versión para que cualquiera lo descargue.
name: Instalador para Windows

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "templates/**"
      - "static/**"
      - "requirements.txt"
      - "empaquetado/**"
      - ".github/workflows/instalador-windows.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Leer la versión
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path app.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ("${{ github.event_name }}" -eq "release") { $v = "${{ github.event.release.tag_name }}".TrimStart("v") }
          if ($v -notmatch '^\d+\.\d+') { $v = "1.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versión: $v"

      - name: Compilar BSOBPDF.exe con PyInstaller
        run: pyinstaller --noconfirm --clean empaquetado/BSOBPDF.spec --distpath dist --workpath build

      - name: Probar el programa compilado
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\BSOBPDF\BSOBPDF.exe" -ArgumentList "--prueba=$PWD\prueba.txt" -Wait -PassThru
          Get-Content prueba.txt
          if ($p.ExitCode -ne 0) { throw "La prueba del programa falló (código $($p.ExitCode))" }

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Crear el instalador
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "empaquetado\BSOBPDF.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }
          Get-ChildItem dist\BSOBPDF-Setup-*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Probar el instalador (instalación silenciosa)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\BSOBPDF-Setup-*.exe | Select-Object -First 1
          $i = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "La instalación falló (código $($i.ExitCode))" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\BSOBPDF\BSOBPDF.exe"
          if (-not (Test-Path $exe)) { throw "No se encontró $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--prueba=$PWD\prueba-instalado.txt" -Wait -PassThru
          Get-Content prueba-instalado.txt
          if ($p.ExitCode -ne 0) { throw "El programa instalado falló (código $($p.ExitCode))" }
          $u = Join-Path $env:LOCALAPPDATA "Programs\BSOBPDF\unins000.exe"
          Start-Process -FilePath $u -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          for ($n = 0; ($n -lt 60) -and (Test-Path $exe); $n++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "El desinstalador no quitó el programa" }
          Write-Host "Instalación, prueba y desinstalación correctas."

      - name: Guardar el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BSOBPDF-Setup-${{ steps.ver.outputs.version }}
          path: dist/BSOBPDF-Setup-*.exe
          retention-days: 30

      - name: Adjuntar el instalador a la versión publicada
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BSOBPDF-Setup-*.exe
